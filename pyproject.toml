[project]
name = "backuper"
version = "0.2.0"
description = "Manifest-driven rsync backups with systemd timer and journal logging"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "tomli-w>=1.0",
]

[project.scripts]
backuper = "backuper.cli:main"

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backuper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"          # bumps [project].version and uv.lock
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true        # while 0.x, breaking changes bump minor, not 1.0
version_files = ["packaging/arch/PKGBUILD:^pkgver="]  # keep PKGBUILD in step
